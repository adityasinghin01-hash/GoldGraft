# Runs the vendored legacy shop UNMODIFIED (src/ is Cutover's MIT sample, see NOTICE.md).
# Needs Docker (CI / Linux). Not runnable on the team Mac without Docker.
# Sandbox credentials come from a local .env file that is never committed:
#   PAYPAL_NVP_USER, PAYPAL_NVP_PWD, PAYPAL_NVP_SIGNATURE, SHOP_RECEIVER_EMAIL
# Without them the shop still starts (health check passes) but PayPal calls fail.
services:
  shop:
    build: .
    ports:
      - "8081:80"
    environment:
      PAYPAL_NVP_USER: ${PAYPAL_NVP_USER:-}
      PAYPAL_NVP_PWD: ${PAYPAL_NVP_PWD:-}
      PAYPAL_NVP_SIGNATURE: ${PAYPAL_NVP_SIGNATURE:-}
      SHOP_RECEIVER_EMAIL: ${SHOP_RECEIVER_EMAIL:-}
      SHOP_BASE_URL: ${SHOP_BASE_URL:-http://localhost:8081}
    volumes:
      - shop-data:/var/www/html/data   # orders.json lives here (flat-file "database")
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  shop-data:
