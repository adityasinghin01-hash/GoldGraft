[project]
name = "goldgraft-fakes"
version = "0.1.0"
description = "Stand-ins for GoldGraft pieces: API, runner, proof, PayPal sandbox, agent tools"
requires-python = ">=3.12,<3.13"
dependencies = ["goldgraft-contracts", "goldgraft-foundation", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=42", "jsonschema>=4"]
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldgraft_fakes"]

[tool.uv.sources]
goldgraft-contracts = { workspace = true }
goldgraft-foundation = { workspace = true }
