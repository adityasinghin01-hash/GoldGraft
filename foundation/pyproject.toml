[project]
name = "goldgraft-foundation"
version = "0.1.0"
description = "Shared hash-chained ledger and durable Graft Cycle tracker"
requires-python = ">=3.12,<3.13"
dependencies = ["goldgraft-contracts", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4"]
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldgraft_foundation"]

[tool.uv.sources]
goldgraft-contracts = { workspace = true }
