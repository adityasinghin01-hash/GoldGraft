[project]
name = "goldgraft"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["goldgraft-contracts", "goldgraft-foundation", "goldgraft-fakes"]

[tool.uv.workspace]
members = ["contracts", "foundation", "fakes"]

[tool.uv.sources]
goldgraft-contracts = { workspace = true }
goldgraft-foundation = { workspace = true }
goldgraft-fakes = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pydantic>=2,<3", "hypothesis>=6", "jsonschema>=4", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
markers = ["live: requires real external services; opt in with GOLDGRAFT_LIVE=1"]
testpaths = ["contracts/tests", "foundation/tests", "fakes/tests", "fixtures/tests", "plugtests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
