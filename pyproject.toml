[project]
name = "goldgraft"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["goldgraft-contracts", "goldgraft-foundation"]

[tool.uv.workspace]
members = ["contracts", "foundation"]

[tool.uv.sources]
goldgraft-contracts = { workspace = true }
goldgraft-foundation = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pydantic>=2,<3", "hypothesis>=6", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "foundation/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
