[project]
name = "goldgraft-contracts"
version = "0.1.0"
description = "Versioned GoldGraft boundary formats"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3"]
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldgraft_contracts"]
